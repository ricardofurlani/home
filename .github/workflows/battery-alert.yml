name: Battery Alert APK

on:
  push:
    paths:
      - "battery-alert/**"
      - ".github/workflows/battery-alert.yml"
  pull_request:
    paths:
      - "battery-alert/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battery-alert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bateria-100-apk
          path: |
            battery-alert/app/build/outputs/apk/debug/app-debug.apk
            battery-alert/app/build/outputs/apk/release/app-release.apk
